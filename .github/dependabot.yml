version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # The local lab pins the LiteLLM image the plugin was checked against: a bump here is a version
  # change, so read the release notes and re-run the smoke test before merging it.
  - package-ecosystem: docker-compose
    directory: /dev/litellm
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
