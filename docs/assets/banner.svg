<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">cc-litellm</title>
  <desc id="d">A Claude Code plugin that shows your LiteLLM virtual key budget and lets admins manage keys, without leaving the terminal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#15133a"/>
      <stop offset="1" stop-color="#2a1250"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.7" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1280" height="340" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#glow)"/>
    <g stroke="#ffffff" stroke-opacity="0.04">
      <path d="M0 85H1280M0 170H1280M0 255H1280"/>
      <path d="M320 0V340M640 0V340M960 0V340"/>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="72" y="140" font-size="76" font-weight="800" fill="url(#accent)" letter-spacing="-2">cc-litellm</text>
    <text x="74" y="190" font-size="28" fill="#e2e8f0">Your LiteLLM key, budget and fallbacks —</text>
    <text x="74" y="228" font-size="28" fill="#e2e8f0">inside <tspan font-weight="700" fill="#ffffff">Claude Code</tspan>.</text>
    <text x="74" y="286" font-size="18" fill="#94a3b8">watch the budget · generate keys · grant extra budget · read the router fallback chains</text>
  </g>

  <g transform="translate(700 92)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="508" height="156" rx="16" fill="#0b1020" fill-opacity="0.78" stroke="#a78bfa" stroke-opacity="0.45"/>
    <circle cx="26" cy="26" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="26" r="6" fill="#febc2e"/>
    <circle cx="66" cy="26" r="6" fill="#28c840"/>
    <text x="28" y="72" font-size="15" fill="#fbbf24">⚠ litellm-key: 83% of budget · $41.37 of $50.00</text>
    <rect x="28" y="88" width="452" height="12" rx="6" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="28" y="88" width="375" height="12" rx="6" fill="url(#bar)"/>
    <text x="28" y="130" font-size="14" fill="#94a3b8">/litellm grant 10 --key claude-code-ana</text>
    <text x="410" y="130" font-size="14" fill="#34d399">→ $60.00</text>
  </g>
</svg>
